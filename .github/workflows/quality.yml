name: Quality

# `pull_request:` carried no branch filter, so a PR opened between two feature
# branches ran the full 20-minute suite as well. Only PRs targeting main gate a
# merge here, so only those need the run.
#
# paths-ignore skips a docs-only change. It fires only when EVERY changed file
# matches, so a PR touching a doc *and* source still runs. Root-level *.md
# only (README / CLAUDE / AGENTS / SECURITY / design) — never **/*.md, because
# posts under content/ feed routes the e2e suite covers.
on:
  pull_request:
    branches:
      - main
    paths-ignore: ["docs/**", "*.md"]
  push:
    branches:
      - main
    paths-ignore: ["docs/**", "*.md"]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The push-to-main run is a safety net, but the squash-merge commit GitHub
  # creates was already validated by the PR's own run — same tree, same 20
  # minutes, twice.
  #
  # Skipping requires BOTH signals: committer == noreply@github.com (the commit
  # was produced by GitHub merging a PR, not pushed from a laptop) AND "(#" in
  # the message (GitHub's default squash-merge subject). Either one missing and
  # validation runs as usual. The committer check is what makes this safe —
  # contains() cannot tell subject from body, and commit bodies routinely
  # reference other PR numbers, so the message alone would misread a direct
  # push to main as "already verified".
  #
  # Known limits, accepted on purpose (this is NOT branch protection):
  #   · It proves the commit arrived through GitHub, not that the PR's CI was
  #     green. Confirm the PR checks passed before merging.
  #   · A commit made through the GitHub web editor directly on main also has
  #     committer noreply@github.com; if its message contains "(#" it is
  #     skipped too. Don't edit main in the web UI.
  #   · The PR validated its merge ref; if main moved on afterwards without a
  #     re-run, the merged result was never checked exactly as it landed.
  validate:
    if: >-
      github.event_name == 'pull_request'
      || github.event.head_commit.committer.email != 'noreply@github.com'
      || !contains(github.event.head_commit.message, '(#')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vibesku_e2e
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vibesku_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vibesku_e2e
      JOBS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vibesku_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vibesku_e2e
      BETTER_AUTH_SECRET: ci-only-secret-at-least-32-characters
      RESEND_API_KEY: re_ci_placeholder
      RESEND_EMAIL_FROM: noreply@example.com
      R2_ENDPOINT: https://example.r2.cloudflarestorage.com
      R2_ACCESS_KEY_ID: ci-placeholder
      R2_SECRET_ACCESS_KEY: ci-placeholder
      R2_BUCKET_NAME: ci-placeholder
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_ENVIRONMENT: test_mode
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      LLM_API_KEY: ci-placeholder-llm-key
      NEXT_PUBLIC_APP_URL: https://example.com

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Verify committed migration history
        run: |
          if [ -n "$(git status --porcelain -- src/database/migrations)" ]; then
            git status --short -- src/database/migrations
            exit 1
          fi
      - run: pnpm db:migrate
      - run: pnpm prettier:check
      - run: pnpm lint
      - run: pnpm dead-code:check
      - run: pnpm type-check
      - run: pnpm test --runInBand
      - run: pnpm test:jobs:integration
      - run: pnpm build:worker
      - run: pnpm worker:smoke
      - run: pnpm worker:shutdown-smoke
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
